server:
  port: 9424
spring:
    application:
        name: iia
    datasource:
        url: jdbc:mysql://localhost:3306/iia?useSSL=false&serverTimezone=UTC
        username: root
        password:
        driver-class-name: com.mysql.cj.jdbc.Driver
    data:
        redis:
            host: localhost
            port: 6379
            username: iia-app
            password: 123456
            timeout: 60000 # Connection timeout (milliseconds)
            key-prefix: "iia:" # Redis key prefix
            # Connection pool configuration
            lettuce:
                pool:
                    max-active: 8
                    max-idle: 8
                    min-idle: 0
                    max-wait: -1ms
    mail:
        host: smtp.qq.com           # QQ email SMTP server
        username: inforassistant@foxmail.com  # Sender email
        password: gtpjjuyufsracihj   # Email authorization code (not login password)
        expiration: 5 # Verification code expires in 5 minutes
        properties:
            mail.smtp.auth: true
            mail.smtp.starttls.enable: true
            mail.smtp.starttls.required: true
mybatis:
    mapper-locations: classpath:mapper/*.xml  # XML SQL mapping files
    type-aliases-package: com.charles.server.iia.auth.entity  # Entity package
    configuration:
        map-underscore-to-camel-case: true  # Map underscore to camel case
# JWT Configuration
jwt:
    secret: ThisIsASecretKeyForJWTThatIsAtLeast64BytesLongEnoughForHS512AlgorithmSecurityRequirements!
    expiration: 86400000 # Token validity period, set to 24 hours here
    refresh-expiration: 604800000 # Refresh Token validity period, set to 7 days here

# SpringDoc OpenAPI 3 (Swagger) Configuration
springdoc:
    api-docs:
        path: /v3/api-docs          # OpenAPI JSON document path
    swagger-ui:
        path: /swagger-ui.html      # Swagger UI interface path
        enabled: true               # Enable Swagger UI
        operations-sorter: method   # Sort by HTTP method
        tags-sorter: alpha          # Sort tags alphabetically
        try-it-out-enabled: true    # Enable "Try it out" feature
        filter: true                # Enable search filter
    show-actuator: false            # Do not show Actuator endpoints
    default-consumes-media-type: application/json
    default-produces-media-type: application/json
    paths-to-match: /api/**         # Only match paths starting with /api
logging:
    level:
        org.springdoc: DEBUG        # Enable SpringDoc debug logging

reminder:
    color:
        default: "#409EFF"