# ============================================
# 主配置文件 - 公共配置
# ============================================

# Spring Boot 应用配置
spring:
  application:
    name: iia
  profiles:
    active: dev  # 默认激活开发环境

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml  # XML SQL mapping files
  type-aliases-package: com.charles.server.iia.auth.entity  # Entity package
  configuration:
    map-underscore-to-camel-case: true  # Map underscore to camel case

# JWT 配置
jwt:
  secret: ThisIsASecretKeyForJWTThatIsAtLeast64BytesLongEnoughForHS512AlgorithmSecurityRequirements!
  expiration: 86400000 # Token有效期，24小时
  refresh-expiration: 604800000 # Refresh Token有效期，7天

# SpringDoc OpenAPI 3 (Swagger) 配置
springdoc:
  api-docs:
    path: /v3/api-docs          # OpenAPI JSON文档路径
  swagger-ui:
    path: /swagger-ui.html      # Swagger UI界面路径
    enabled: true               # 启用Swagger UI
    operations-sorter: method   # 按HTTP方法排序
    tags-sorter: alpha          # 按字母顺序排序标签
    try-it-out-enabled: true    # 启用"Try it out"功能
    filter: true                # 启用搜索过滤器
  show-actuator: false          # 不显示Actuator端点
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match: /api/**       # 只匹配以/api/开头的路径

# 日志配置
logging:
  level:
    org.springdoc: DEBUG        # 启用SpringDoc调试日志
    com.charles.server: DEBUG   # 项目包调试日志

# 提醒功能颜色配置
color:
  project: "#409EFF"
  tag: "#FF9900"

# ============================================
# 应用自定义配置
# ============================================
app:
  env: ${spring.profiles.active:dev}  # 继承Spring环境
  verification:
    code:
      return-to-client: false  # 默认不返回验证码到客户端
  debug: false                 # 调试模式
  mock-email: false            # 模拟邮件发送