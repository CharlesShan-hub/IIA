services:
  mysql:
    image: mysql:8.4
    container_name: iia-mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=iia
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/create_db.sql:/docker-entrypoint-initdb.d/01_create_db.sql:ro
      - ./sql/create_auth.sql:/docker-entrypoint-initdb.d/02_create_auth.sql:ro
      - ./sql/create_task.sql:/docker-entrypoint-initdb.d/03_create_task.sql:ro
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: iia-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf # Redis配置文件
      - ./users.acl:/usr/local/etc/redis/users.acl  # ACL用户文件
      - redis_data:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    healthcheck:
      # 使用管理员账户进行健康检查
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "123456", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    container_name: iia-client
    image: node:22-bullseye
    working_dir: /app
    environment:
      - HOST=0.0.0.0
      - VITE_PORT=3006
      - VITE_API_PROXY_URL=http://host.docker.internal:9424
      - PNPM_STORE_PATH=/pnpm-store
      - CHOKIDAR_USEPOLLING=0
      - COREPACK_NPM_REGISTRY=https://registry.npmmirror.com
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - HTTP_PROXY=http://host.docker.internal:7897
      - HTTPS_PROXY=http://host.docker.internal:7897
      - NO_PROXY=localhost,127.0.0.1,.local,.docker.internal
    volumes:
      - ${IIA_CLIENT_DIR:-./client}:/app
      - client_node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    command: >
      sh -lc "npm config set registry https://registry.npmmirror.com &&
              corepack enable &&
              corepack prepare pnpm@10.25.0 --activate || npm i -g pnpm &&
              pnpm -v && node -v &&
              pnpm config set store-dir /pnpm-store &&
              (pnpm install --frozen-lockfile || pnpm install) &&
              pnpm exec vite --host 0.0.0.0 --port 3006 --strictPort"
    ports:
      - "3006:3006"
    depends_on:
      - mysql
      - redis
      - server-dev
    restart: unless-stopped

  # SpringBoot开发环境（支持热重载）
  server-dev:
    container_name: iia-server-dev
    image: maven:3.9.6-eclipse-temurin-21
    working_dir: /app
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - TZ=Asia/Shanghai
      - MAVEN_OPTS=-Duser.home=/var/maven
      - HTTP_PROXY=http://host.docker.internal:7897
      - HTTPS_PROXY=http://host.docker.internal:7897
      - NO_PROXY=localhost,127.0.0.1,.local,.docker.internal
    volumes:
      - ${IIA_SERVER_DIR:-./server}:/app
      - maven_repo:/var/maven/.m2/repository
    ports:
      - "9424:9424"
      - "5005:5005"  # 远程调试端口
    command: >
      sh -c "echo 'Starting Spring Boot with hot reload...' &&
             mvn spring-boot:run -Dspring-boot.run.jvmArguments='-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    # 暂时禁用健康检查，因为应用没有actuator端点
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:9424/actuator/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

volumes:
  mysql_data:
    driver: local
    name: iia-mysql-data
  client_node_modules:
  pnpm_store:
  redis_data:
  maven_repo:
