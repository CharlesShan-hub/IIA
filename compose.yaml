version: "3.9"
services:
  mysql:
    image: mysql:8.4
    container_name: iia-mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=iia
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/create_db.sql:/docker-entrypoint-initdb.d/01_create_db.sql:ro
      - ./sql/create_auth.sql:/docker-entrypoint-initdb.d/02_create_auth.sql:ro
      - ./sql/create_task.sql:/docker-entrypoint-initdb.d/03_create_task.sql:ro
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: iia-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf # Redis配置文件
      - ./users.acl:/usr/local/etc/redis/users.acl  # ACL用户文件
      - redis_data:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    healthcheck:
      # 使用管理员账户进行健康检查
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "123456", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    container_name: iia-client
    image: node:22-bullseye
    working_dir: /app
    environment:
      - HOST=0.0.0.0
      - VITE_PORT=3006
      - VITE_API_PROXY_URL=http://host.docker.internal:8080
      - PNPM_STORE_PATH=/pnpm-store
      - CHOKIDAR_USEPOLLING=0
      - COREPACK_NPM_REGISTRY=https://registry.npmmirror.com
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - HTTP_PROXY=http://host.docker.internal:7897
      - HTTPS_PROXY=http://host.docker.internal:7897
      - NO_PROXY=localhost,127.0.0.1,.local,.docker.internal
    volumes:
      - ${IIA_CLIENT_DIR:-./client}:/app
      - client_node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    command: >
      sh -lc "npm config set registry https://registry.npmmirror.com &&
              corepack enable &&
              corepack prepare pnpm@10.25.0 --activate || npm i -g pnpm &&
              pnpm -v && node -v &&
              pnpm config set store-dir /pnpm-store &&
              (pnpm install --frozen-lockfile || pnpm install) &&
              pnpm exec vite --host 0.0.0.0 --port 3006 --strictPort"
    ports:
      - "3006:3006"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
    name: iia-mysql-data
  client_node_modules:
  pnpm_store:
  redis_data: